name: Build and Release

permissions:
  contents: write


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - macos
          - all

jobs:
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: cd cpu_monitor && cargo build --release
      
    - name: Build Flutter Linux app
      run: flutter build linux --release
      
    - name: Create Linux AppImage
      run: |
        # Create a simple directory structure for the app
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Copy the built app
        cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
        cp cpu_monitor/target/release/libcpu_monitor.so AppDir/usr/lib/
        
        # Create .desktop file
        cat > AppDir/usr/share/applications/demo_flutter_rust_cpu.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=CPU Monitor Demo
        Comment=Flutter-Rust CPU Monitor Demo
        Icon=demo_flutter_rust_cpu
        Exec=demo_flutter_rust_cpu
        Categories=System;Monitor;
        EOF
        
        # Create a simple icon (placeholder)
        echo "Creating placeholder icon..."
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: build/linux/x64/release/bundle/
        
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: |
        cd cpu_monitor
        cargo build --release --target x86_64-pc-windows-msvc
        
    - name: Copy Rust library to expected location
      run: |
        if (!(Test-Path cpu_monitor\target\release)) { mkdir cpu_monitor\target\release }
        copy cpu_monitor\target\x86_64-pc-windows-msvc\release\cpu_monitor.dll cpu_monitor\target\release\
        
    - name: Build Flutter Windows app
      run: flutter build windows --release
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/windows/x64/runner/Release/
        
  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: cd cpu_monitor && cargo build --release
      
    - name: Build Flutter macOS app
      run: flutter build macos --release
      
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: build/macos/Build/Products/Release/
        
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archives
      run: |
        # Create archives for each platform
        cd linux-build && tar -czf ../demo-flutter-rust-cpu-linux.tar.gz * && cd ..
        cd windows-build && zip -r ../demo-flutter-rust-cpu-windows.zip * && cd ..
        cd macos-build && tar -czf ../demo-flutter-rust-cpu-macos.tar.gz * && cd ..
        
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "demo-flutter-rust-cpu-*.tar.gz,demo-flutter-rust-cpu-*.zip"
        draft: false
        prerelease: false
        generateReleaseNotes: true
        token: ${{ secrets.GITHUB_TOKEN }}
