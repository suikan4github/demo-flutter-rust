name: Build and Release

permissions:
  contents: write


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - macos
          - all

jobs:
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: cd cpu_monitor && cargo build --release

    - name: Build Flutter Linux app
      run: flutter build linux --release

    - name: Copy Rust library to Flutter bundle (lib/)
      run: |
        mkdir -p build/linux/x64/release/bundle/lib
        cp cpu_monitor/target/release/libcpu_monitor.so build/linux/x64/release/bundle/lib/

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: build/linux/x64/release/bundle/
        
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: |
        cd cpu_monitor
        cargo build --release --target x86_64-pc-windows-msvc
        
    - name: Copy Rust library to Flutter bundle (lib/)
      run: |
        powershell -Command "New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\lib"
        copy cpu_monitor\target\x86_64-pc-windows-msvc\release\cpu_monitor.dll build\windows\x64\runner\Release\lib\
        
    - name: Build Flutter Windows app
      run: flutter build windows --release
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/windows/x64/runner/Release/
        
  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: cd cpu_monitor && cargo build --release

    - name: Build Flutter macOS app
      run: flutter build macos --release

    - name: Copy Rust library to Flutter bundle (lib/)
      run: |
        mkdir -p build/macos/Build/Products/Release/lib
        cp cpu_monitor/target/release/libcpu_monitor.dylib build/macos/Build/Products/Release/lib/

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: build/macos/Build/Products/Release/
        
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Set version and arch variables
      id: vars
      run: |
        VERSION=${GITHUB_REF##*/}
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "arch=$(uname -m)" >> $GITHUB_OUTPUT

    - name: Create release archives
      run: |
        VERSION=${{ steps.vars.outputs.version }}
        ARCH=${{ steps.vars.outputs.arch }}
        PROJECT=demo-flutter-rust-cpu
        # Normalize arch
        if [ "$ARCH" = "x86_64" ]; then ARCH="x86_64"; fi
        if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
        cd linux-build && tar -czf ../${PROJECT}-${VERSION}-linux-${ARCH}.tar.gz * && cd ..
        cd windows-build && zip -r ../${PROJECT}-${VERSION}-windows-${ARCH}.zip * && cd ..
        cd macos-build && tar -czf ../${PROJECT}-${VERSION}-macos-${ARCH}.tar.gz * && cd ..
        
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "demo-flutter-rust-cpu-*.tar.gz,demo-flutter-rust-cpu-*.zip"
        draft: false
        prerelease: false
        generateReleaseNotes: true
        token: ${{ secrets.GITHUB_TOKEN }}
