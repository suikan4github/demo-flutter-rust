name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Dart/Flutter CI
  flutter-ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze project source
      run: flutter analyze
      
    - name: Run tests
      run: flutter test

  # Rust CI
  rust-ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cpu_monitor
        
    - name: Check formatting
      run: cd cpu_monitor && cargo fmt --all -- --check
      
    - name: Run clippy
      run: cd cpu_monitor && cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Run tests
      run: cd cpu_monitor && cargo test
      
    - name: Build release
      run: cd cpu_monitor && cargo build --release

  # Integration test (Flutter + Rust)
  integration-test:
    runs-on: ubuntu-latest
    needs: [flutter-ci, rust-ci]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Build Rust library
      run: cd cpu_monitor && cargo build --release
      
    - name: Build Flutter Linux app
      run: flutter build linux --release
      
    - name: Test FFI integration
      run: |
        # Simple integration test to check if the library loads
        cd cpu_monitor/target/release
        if [ -f "libcpu_monitor.so" ]; then
          echo "✅ Rust library built successfully"
          ldd libcpu_monitor.so
        else
          echo "❌ Rust library not found"
          exit 1
        fi
